[package]
name = "claude-bridge"
version = "0.3.3"
edition = "2021"
description = "Claude Code <-> Gemini deep-compatibility bridge with live model switching"
repository = "https://github.com/duojiwu58-boop/claude-code-gemini-bridge"
license = "GPL-3.0-only"

[dependencies]
axum = "=0.7.5"
futures-util = "=0.3.31"
idna_adapter = "=1.0.0"
indexmap = "=2.2.6"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "=1.0.117"
tokio = { version = "=1.37.0", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.5.2", features = ["limit", "trace"] }
tracing = "=0.1.40"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
url = "=2.5.0"
uuid = { version = "=1.8.0", features = ["v4"] }
windows-sys = { version = "=0.52.0", features = ["Win32_Storage_FileSystem"] }
windows-service = "=0.8.1"
