[package]
name = "claude-bridge"
version = "0.8.0"
edition = "2021"
description = "Multi-model Agent Runtime for Claude Code with deep semantic adaptation and live model switching"
repository = "https://github.com/duojiwu58-boop/claude-code-multi-model-agent-runtime"
license = "GPL-3.0-only"

[dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
futures-util = "=0.3.31"
idna_adapter = "=1.0.0"
indexmap = "=2.2.6"
png = "=0.17.16"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "=1.0.117"
sha2 = "=0.10.8"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "=0.28.0"
tower-http = { version = "=0.6.11", features = ["limit", "trace"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.8"
uuid = { version = "=1.8.0", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
windows = { version = "=0.61.3", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "=0.8.1"

[build-dependencies]
embed-resource = "=2.5.2"
